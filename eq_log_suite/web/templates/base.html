<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}EQ Log Suite{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/table.js" defer></script>
  <script>
    // In the app window (eq_log_suite/desktop.py), a page's new tab opens
    // as another app window instead of in the browser.
    window.addEventListener("pywebviewready", () => {
      window.open = (url) => { window.pywebview.api.open_window(String(url)); return null; };
    });
  </script>
</head>
<body>
  {% if not embed %}
  <nav>
    <a href="/">Home</a>
    <span class="nav-divider"></span>
    <span class="nav-group" title="The selected log, over the picker's time window">Live:</span>
    <a href="/live">Live</a>
    <a href="/encounters">Encounters</a>
    <a href="/events">Browse Events</a>
    <span class="nav-divider"></span>
    <span class="nav-group" title="Knowledge and history kept from every log recorded">Database:</span>
    <a href="/eql">EQ Legends</a>
    <a href="/eq">EverQuest</a>
    <a href="/query">SQL Query</a>
    <span class="nav-divider"></span>
    <a href="/import">Import</a>
    <a href="/alerts">Alerts</a>
  </nav>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
